name: linkbreeze

services:
  linkbreeze-demo:
    build:
      context: .
      args:
        - DEMO_MODE=true
        - DEMO_AUTO_LOGIN=true
        - DEMO_FRAME_ORIGIN=https://linkbreeze.omnirise.dev
        - NEXT_PUBLIC_DEMO_MODE=true
        # Cloudflare injects its analytics beacon into the demo host; without
        # this the demo CSP blocks it (console violation on every page).
        - EXTRA_SCRIPT_SRC=static.cloudflareinsights.com
    ports:
      - "3010:3000"
    volumes:
      - ./data-demo:/app/data
    environment:
      - DATABASE_PATH=/app/data/linkbreeze.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEMO_MODE=true
      - DEMO_AUTO_LOGIN=true
      - DEMO_FRAME_ORIGIN=https://linkbreeze.omnirise.dev
      - NEXT_PUBLIC_DEMO_MODE=true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Build AND push ghcr.io/manak-hash/linkbreeze:test (multi-arch, no version tag, no GitHub release)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Official Docker Hub image (omnirise/linkbreeze) — the default public
  # pull path as LinkBreeze moves under the OmniRise brand.
  DOCKERHUB_IMAGE: omnirise/linkbreeze

jobs:
  setup:
    name: Determine publish mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Set publish mode
        id: mode
        run: |
          # dispatch + publish_test=false -> dry-run | dispatch + true -> test tag | tag push -> release
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish_test }}" = "true" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dryrun" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # GHCR requires lowercase image names
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.setup.outputs.mode != 'dryrun'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dry-run path (workflow_dispatch, publish_test=false): build only, push nothing.
      - name: Build (dry-run)
        if: needs.setup.outputs.mode == 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      # Build and push by digest to BOTH registries (GHCR + Docker Hub mirror);
      # the manifest lists are assembled by the merge job.
      - name: Build and push by digest
        id: build
        if: needs.setup.outputs.mode != 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Push Docker Hub by digest
        id: build-hub
        if: needs.setup.outputs.mode != 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: needs.setup.outputs.mode != 'dryrun'
        run: |
          mkdir -p /tmp/digests
          # buildx provenance attestations make each push a distinct index, so
          # the two registries do NOT share digests. Export one file per
          # registry; each merge step consumes only its own prefix.
          ghcr_digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/ghcr-${ghcr_digest#sha256:}"
          hub_digest="${{ steps.build-hub.outputs.digest }}"
          touch "/tmp/digests/hub-${hub_digest#sha256:}"

      - name: Upload digest
        if: needs.setup.outputs.mode != 'dryrun'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    if: needs.setup.outputs.mode != 'dryrun'
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Prepare
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "HUB_IMAGE=${DOCKERHUB_IMAGE}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release path: latest + <version> tags. Test path: just :test.
      - name: Docker meta (release)
        if: needs.setup.outputs.mode == 'release'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Docker meta (test)
        if: needs.setup.outputs.mode == 'test'
        id: meta-test
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=test

      - name: Create manifest list and push (GHCR)
        working-directory: /tmp/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digests=""
          for f in ghcr-*; do digests="$digests ${{ env.IMAGE }}@sha256:${f#ghcr-}"; done
          # Intentional word splitting: $tags and $digests are multi-word arg lists.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $digests

      # Same digests re-tagged under the official OmniRise Docker Hub image —
      # identical content, brand-home pull path.
      - name: Create manifest list and push (Docker Hub)
        working-directory: /tmp/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON" | sed "s|${{ env.IMAGE }}|${{ env.HUB_IMAGE }}|g")"
          digests=""
          for f in hub-*; do digests="$digests ${{ env.HUB_IMAGE }}@sha256:${f#hub-}"; done
          # Intentional word splitting: $tags and $digests are multi-word arg lists.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $digests

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version || steps.meta-test.outputs.version }}"
          docker buildx imagetools inspect "${{ env.HUB_IMAGE }}:${{ steps.meta.outputs.version || steps.meta-test.outputs.version }}"

  # Website sync: the marketing site is the source of truth for update checks
  # (linkbreeze.omnirise.dev/latest-version.json). On a release tag, copy this
  # repo's prepared latest-version.json (version/releasedAt/notes edited as
  # part of release prep) into the website repo and open a PR — merging it
  # deploys the new update-banner data via Vercel. The url field is always
  # forced to the canonical GitHub release so the banner link can never point
  # at a mirror. Requires the WEBSITE_SYNC_TOKEN secret (PAT with repo scope
  # on Manak-hash/LinkBreeze-Website).
  website-sync:
    name: Sync latest-version.json to website (PR)
    if: needs.setup.outputs.mode == 'release'
    runs-on: ubuntu-latest
    needs: [setup, merge]
    steps:
      - uses: actions/checkout@v7

      - name: Check out website repo
        uses: actions/checkout@v7
        with:
          repository: Manak-hash/LinkBreeze-Website
          token: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          path: website

      - name: Update website latest-version.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg url "https://github.com/Manak-hash/LinkBreeze/releases/tag/${TAG}" \
            '.url = $url' \
            latest-version.json > website/public/latest-version.json
          cat website/public/latest-version.json

      - name: Open PR on the website repo
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd website
          git config user.name "linkbreeze-release-bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="release-sync/${TAG}"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): sync latest-version.json for ${TAG}"
          git push origin "$BRANCH"
          gh pr create -R Manak-hash/LinkBreeze-Website \
            --base main --head "$BRANCH" \
            --title "Release sync: ${TAG}" \
            --body "Automated sync of \`public/latest-version.json\` for ${TAG} (source: LinkBreeze release workflow). Merge to deploy the new update-banner data."
